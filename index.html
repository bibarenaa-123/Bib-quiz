<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BIB1 ARENA | Warrior Entry</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --orange: #FF7800;
            --glass-clear: rgba(255, 255, 255, 0.02);
            --glass-active: rgba(5, 5, 10, 0.9);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000;
            height: 100vh; width: 100vw;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* ========== BACKGROUND LAYERS ========== */
        #particles-js {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
        }

        .page-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('image_0.png') no-repeat center center;
            background-size: cover;
            opacity: 0.2;
            z-index: 1;
        }

        /* ========== ELITE GLASS CONTAINER ========== */
        .main-container {
            position: relative;
            z-index: 10;
            width: 90%; max-width: 420px;
            background: var(--glass-clear);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 60px 0;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            overflow: hidden;
        }

        /* Translucent state when typing */
        .main-container.is-typing {
            background: var(--glass-active);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-color: var(--orange);
            box-shadow: 0 0 50px rgba(255, 120, 0, 0.2);
        }

        /* ========== HORIZONTAL SLIDE LOGIC ========== */
        .form-stage {
            display: flex;
            width: 200%; /* Side-by-side panels */
            transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .panel { 
            width: 50%; 
            padding: 0 45px; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* The Slide Effect */
        .show-signup .form-stage { transform: translateX(-50%); }

        h2 { 
            font-family: 'Orbitron'; letter-spacing: 5px; 
            margin-bottom: 30px; color: #fff;
            text-shadow: 0 0 10px rgba(255,120,0,0.5);
        }

        input {
            width: 100%; padding: 18px; margin: 10px 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; color: #fff; outline: none;
            transition: 0.3s; font-family: 'Poppins';
        }

        input:focus { border-color: var(--orange); background: rgba(255,255,255,0.1); }

        .btn-glow {
            width: 100%; padding: 18px; margin-top: 25px;
            background: linear-gradient(135deg, var(--orange), #ff4d00);
            border: none; border-radius: 15px; color: white;
            font-family: 'Orbitron'; font-weight: 900;
            box-shadow: 0 10px 30px rgba(255, 120, 0, 0.3);
            cursor: pointer;
        }

        .btn-glow:active { transform: scale(0.95); }
        .btn-glow:disabled { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }

        .bottom-links { margin-top: 30px; font-size: 0.8rem; color: #aaa; }
        .bottom-links p { margin: 10px 0; }
        .bottom-links b { color: var(--orange); cursor: pointer; text-decoration: underline; }

        /* Notification Popup */
        .popup {
            position: fixed; top: 30px; left: 50%;
            transform: translateX(-50%);
            background: #000; border: 1px solid var(--orange);
            padding: 15px 30px; border-radius: 50px;
            color: #fff; z-index: 1000; font-family: 'Orbitron';
            box-shadow: 0 0 20px var(--orange);
            animation: slideDown 0.4s ease forwards;
        }

        @keyframes slideDown { from { top: -100px; } to { top: 30px; } }
    </style>
</head>
<body>

    <div class="page-bg"></div>
    <div id="particles-js"></div>

    <div class="main-container" id="mainContainer">
        <div class="form-stage" id="formStage">
            
            <div class="panel">
                <h2>LOGIN</h2>
                <input type="text" class="auth-input" id="lUser" placeholder="WARRIOR ID">
                <input type="password" class="auth-input" id="lPass" placeholder="PASSCODE">
                <button class="btn-glow" id="lBtn" onclick="handleLogin()">AUTHENTICATE</button>
                <div id="lockTimer" style="color:var(--orange); font-weight:bold; margin-top:15px; font-family:'Orbitron';"></div>
                
                <div class="bottom-links">
                    <p>Forgot passcode?</p>
                    <p onclick="toggleView(true)">New BIB Warrior? <b>Initialize Identity</b></p>
                </div>
            </div>

            <div class="panel">
                <h2>SIGN UP</h2>
                <input type="text" class="auth-input" id="sUser" placeholder="NEW WARRIOR ID">
                <input type="password" class="auth-input" id="sPass" placeholder="SET PASSCODE">
                <input type="password" class="auth-input" id="sConfirm" placeholder="CONFIRM PASSCODE">
                <button class="btn-glow" id="sBtn" onclick="handleSignup()">INITIALIZE</button>
                
                <div class="bottom-links">
                    <p onclick="toggleView(false)">Registered Warrior? <b>Return to Login</b></p>
                </div>
            </div>

        </div>
    </div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "YOUR_KEY",
        authDomain: "YOUR_DOMAIN",
        databaseURL: "YOUR_URL",
        projectId: "YOUR_ID",
        storageBucket: "YOUR_BUCKET",
        messagingSenderId: "YOUR_SENDER",
        appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // --- PARTICLES.JS ---
    particlesJS("particles-js", {
        "particles": {
            "number": { "value": 90 },
            "color": { "value": "#FF7800" },
            "shape": { "type": "circle" },
            "opacity": { "value": 0.4 },
            "size": { "value": 2 },
            "line_linked": { "enable": true, "distance": 150, "color": "#FF7800", "opacity": 0.3, "width": 1 },
            "move": { "enable": true, "speed": 1.5 }
        },
        "interactivity": {
            "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } }
        }
    });

    // --- SOUNDSCAPE ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type, duration) {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    // --- INTERFACE LOGIC ---
    const mainContainer = document.getElementById('mainContainer');
    const inputs = document.querySelectorAll('.auth-input');

    // Dynamic Glass Toggle
    inputs.forEach(input => {
        input.addEventListener('focus', () => {
            mainContainer.classList.add('is-typing');
            playSound(440, 'sine', 0.1);
        });
        input.addEventListener('blur', () => {
            const anyActive = Array.from(inputs).some(i => i.value.length > 0);
            if (!anyActive) mainContainer.classList.remove('is-typing');
        });
    });

    // SMOOTH SLIDE FUNCTION
    function toggleView(isSignup) {
        if(isSignup) {
            mainContainer.classList.add('show-signup');
        } else {
            mainContainer.classList.remove('show-signup');
        }
        playSound(220, 'square', 0.2);
    }

    // --- SECURITY & AUTH ---
    let attempts = 0;
    let locked = false;

    function handleLogin() {
        if(locked) return;
        const u = document.getElementById('lUser').value;
        const p = document.getElementById('lPass').value;

        if(!u || !p) return showPopup("ERROR", "Fill all fields.");

        auth.signInWithEmailAndPassword(u, p)
            .then(() => {
                playSound(880, 'sine', 0.5);
                showPopup("AUTHORIZED", "Identity verified.");
            })
            .catch(() => {
                attempts++;
                playSound(110, 'sawtooth', 0.3);
                showPopup("DENIED", "Wrong credentials entered.");
                if(attempts >= 3) triggerLockout();
            });
    }

    function handleSignup() {
        const u = document.getElementById('sUser').value;
        const p = document.getElementById('sPass').value;
        const c = document.getElementById('sConfirm').value;

        if(p !== c) return showPopup("ERROR", "Passcodes do not match.");

        auth.createUserWithEmailAndPassword(u, p)
            .then(res => {
                db.ref('users/' + res.user.uid).set({ username: u, joined: Date.now() });
                showPopup("SUCCESS", "New BIB Warrior Identity Created.");
                toggleView(false);
            })
            .catch(err => showPopup("FAILED", err.message));
    }

    function triggerLockout() {
        locked = true;
        let t = 30;
        const btn = document.getElementById('lBtn');
        const timer = document.getElementById('lockTimer');
        btn.disabled = true;

        const countdown = setInterval(() => {
            t--;
            timer.innerText = `SECURITY LOCK: ${t}s`;
            if(t <= 0) {
                clearInterval(countdown);
                locked = false;
                attempts = 0;
                btn.disabled = false;
                timer.innerText = "";
            }
        }, 1000);
    }

    function showPopup(title, msg) {
        const p = document.createElement('div');
        p.className = 'popup';
        p.innerHTML = `<span style="color:var(--orange)">${title}:</span> ${msg}`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 3000);
    }
</script>
</body>
</html>
