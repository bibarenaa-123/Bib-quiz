<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BIB1 ARENA | Entry</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --orange: #FF7800;
            --glass-clear: rgba(255, 255, 255, 0.02);
            --glass-focus: rgba(10, 10, 20, 0.7);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ========== THE BACKGROUND LOGO ========== */
        /* This makes image_0.png the actual background of the whole site */
        .page-background {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: url('image_0.png') no-repeat center center;
            background-size: 60%; /* Adjusted for better visibility */
            z-index: 1;
        }

        /* ========== HIGH-TRANSPARENCY GLASS CARD ========== */
        .main-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            background: var(--glass-clear);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 60px 0;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            overflow: hidden;
            
            /* Initial state: Very clear */
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            transition: all 0.5s ease;
        }

        /* The "Translucent" state triggered when typing */
        .main-container.is-typing {
            background: var(--glass-focus);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-color: rgba(255, 120, 0, 0.3);
        }

        .form-stage {
            display: flex;
            width: 200%;
            transition: transform 0.7s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .panel { width: 50%; padding: 0 45px; }
        .show-signup .form-stage { transform: translateX(-50%); }

        h2 { 
            font-family: 'Orbitron'; 
            letter-spacing: 5px; 
            margin-bottom: 30px; 
            text-align: center; 
            color: #fff;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        input {
            width: 100%;
            padding: 18px;
            margin: 10px 0;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            color: #fff;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--orange); background: rgba(255,255,255,0.15); }

        .btn-glow {
            width: 100%;
            padding: 16px;
            margin-top: 25px;
            background: linear-gradient(135deg, var(--orange), #ff4d00);
            border: none;
            border-radius: 15px;
            color: white;
            font-family: 'Orbitron';
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 120, 0, 0.3);
        }

        .btn-glow:disabled { opacity: 0.4; filter: grayscale(1); }

        .switch-link {
            text-align: center;
            margin-top: 30px;
            font-size: 0.85rem;
            color: #fff;
            cursor: pointer;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .switch-link b { color: var(--orange); }

        /* Popup Styles */
        .popup {
            position: fixed; top: 30px; left: 50%;
            transform: translateX(-50%);
            background: #111; border: 1px solid var(--orange);
            padding: 15px 30px; border-radius: 50px;
            color: #fff; z-index: 1000; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="page-background"></div>

    <div class="main-container" id="mainContainer">
        <div class="form-stage">
            
            <div class="panel">
                <h2>LOGIN</h2>
                <input type="text" class="auth-input" id="lUser" placeholder="Username">
                <input type="password" class="auth-input" id="lPass" placeholder="Passcode">
                <button class="btn-glow" id="lBtn" onclick="handleLogin()">AUTHENTICATE</button>
                <div id="lockTimer" style="text-align:center; color:var(--orange); margin-top:10px;"></div>
                <p class="switch-link" onclick="toggleView(true)">New BIB Warrior? <b>Sign Up</b></p>
            </div>

            <div class="panel">
                <h2>SIGN UP</h2>
                <input type="text" class="auth-input" id="sUser" placeholder="Set Username">
                <input type="password" class="auth-input" id="sPass" placeholder="Set Passcode">
                <input type="password" class="auth-input" id="sConfirm" placeholder="Confirm Passcode">
                <button class="btn-glow" onclick="handleSignup()">CREATE IDENTITY</button>
                <p class="switch-link" onclick="toggleView(false)">Already a Warrior? <b>Login</b></p>
            </div>

        </div>
    </div>

<script>
    // --- FIREBASE SETUP ---
    const firebaseConfig = {
        apiKey: "YOUR_KEY",
        authDomain: "YOUR_DOMAIN",
        databaseURL: "YOUR_URL",
        projectId: "YOUR_ID",
        storageBucket: "YOUR_BUCKET",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const mainContainer = document.getElementById('mainContainer');
    const inputs = document.querySelectorAll('.auth-input');

    // --- DYNAMIC GLASS LOGIC ---
    // When user clicks into an input, make the glass translucent (blur/darken)
    inputs.forEach(input => {
        input.addEventListener('focus', () => {
            mainContainer.classList.add('is-typing');
        });
        // When user clicks away, if inputs are empty, return to clear glass
        input.addEventListener('blur', () => {
            const anyActive = Array.from(inputs).some(i => i.value.length > 0);
            if(!anyActive) mainContainer.classList.remove('is-typing');
        });
    });

    let attempts = 0;
    let isLocked = false;

    function toggleView(showSignup) {
        mainContainer.classList.toggle('show-signup', showSignup);
    }

    function handleLogin() {
        if(isLocked) return;
        const u = document.getElementById('lUser').value;
        const p = document.getElementById('lPass').value;

        auth.signInWithEmailAndPassword(u, p)
            .then(() => showPopup("ACCESS GRANTED", "Welcome."))
            .catch(() => {
                attempts++;
                showPopup("DENIED", "Wrong credentials entered.");
                if(attempts >= 3) startLockout();
            });
    }

    function handleSignup() {
        const u = document.getElementById('sUser').value;
        const p = document.getElementById('sPass').value;
        const c = document.getElementById('sConfirm').value;

        if(p !== c) return showPopup("ERROR", "Passcodes mismatch.");

        auth.createUserWithEmailAndPassword(u, p)
            .then(res => {
                db.ref('users/'+res.user.uid).set({username: u, joined: Date.now()});
                showPopup("CREATED", "Identity Saved.");
                toggleView(false);
            })
            .catch(err => showPopup("FAILED", err.message));
    }

    function startLockout() {
        isLocked = true;
        let t = 30;
        const btn = document.getElementById('lBtn');
        const timer = document.getElementById('lockTimer');
        btn.disabled = true;

        const clock = setInterval(() => {
            t--;
            timer.innerText = `LOCKED: ${t}s`;
            if(t <= 0) {
                clearInterval(clock);
                isLocked = false;
                attempts = 0;
                btn.disabled = false;
                timer.innerText = "";
            }
        }, 1000);
    }

    function showPopup(title, msg) {
        const p = document.createElement('div');
        p.className = 'popup';
        p.innerHTML = `${title}: ${msg}`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 3000);
    }
</script>
</body>
</html>
