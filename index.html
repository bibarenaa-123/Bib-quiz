<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BIB1 ARENA | Entry</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --orange: #FF7800;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --blur: 30px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000;
            color: #fff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ========== FULLSCREEN BACKGROUND LOGO ========== */
        .bg-watermark {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: url('image_0.png') no-repeat center center;
            background-size: 70%; /* Adjust size of background logo here */
            opacity: 0.12;
            z-index: -1;
            pointer-events: none;
        }

        /* ========== GLASSMORPHISM CARD ========== */
        .main-container {
            width: 90%;
            max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 50px 0; /* Horizontal padding moved to panels */
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            position: relative;
            z-index: 10;
            overflow: hidden;
        }

        /* LOGO ABOVE FORMS (STILL) */
        .header-logo {
            width: 120px;
            display: block;
            margin: 0 auto 30px;
            filter: drop-shadow(0 0 10px rgba(255,120,0,0.3));
        }

        /* ========== SLIDING MECHANISM ========== */
        .form-stage {
            display: flex;
            width: 200%; /* Side-by-side forms */
            transition: transform 0.7s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .panel {
            width: 50%;
            padding: 0 40px;
            display: flex;
            flex-direction: column;
        }

        /* Shift logic */
        .show-signup .form-stage { transform: translateX(-50%); }

        h2 { font-family: 'Orbitron'; letter-spacing: 4px; margin-bottom: 25px; text-align: center; font-size: 1.4rem; }

        input {
            width: 100%;
            padding: 16px 20px;
            margin: 8px 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        input:focus { border-color: var(--orange); background: rgba(255,255,255,0.1); }

        .btn-glow {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            background: linear-gradient(135deg, var(--orange), #ff4d00);
            border: none;
            border-radius: 15px;
            color: white;
            font-family: 'Orbitron';
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 120, 0, 0.3);
            transition: 0.3s;
        }

        .btn-glow:active { transform: scale(0.98); }
        .btn-glow:disabled { background: #333; box-shadow: none; opacity: 0.5; }

        .switch-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
            color: #ccc;
            cursor: pointer;
        }

        .switch-link b { color: var(--orange); }

        /* ========== POPUP NOTIFICATIONS ========== */
        .popup {
            position: fixed; top: 30px; left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 20, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--orange);
            padding: 15px 35px;
            border-radius: 50px;
            z-index: 99999;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            animation: popIn 0.4s ease;
        }

        @keyframes popIn { from { transform: translate(-50%, -100px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

        #timerText { color: var(--orange); font-family: 'Orbitron'; font-size: 0.8rem; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="bg-watermark"></div>

    <div class="main-container" id="mainContainer">
        <img src="image_0.png" class="header-logo" alt="BIB1">

        <div class="form-stage" id="formStage">
            
            <div class="panel">
                <h2>LOGIN</h2>
                <input type="text" id="lUser" placeholder="Username">
                <input type="password" id="lPass" placeholder="Passcode">
                <button class="btn-glow" id="lBtn" onclick="handleLogin()">AUTHENTICATE</button>
                <div id="timerText"></div>
                <p class="switch-link" onclick="toggleView(true)">New BIB Warrior? <b>Sign Up</b></p>
            </div>

            <div class="panel">
                <h2>SIGN UP</h2>
                <input type="text" id="sUser" placeholder="Set Username">
                <input type="password" id="sPass" placeholder="Set Passcode">
                <input type="password" id="sConfirm" placeholder="Confirm Passcode">
                <button class="btn-glow" onclick="handleSignup()">CREATE IDENTITY</button>
                <p class="switch-link" onclick="toggleView(false)">Existing Warrior? <b>Login</b></p>
            </div>

        </div>
    </div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "YOUR_KEY",
        authDomain: "YOUR_DOMAIN",
        databaseURL: "YOUR_URL",
        projectId: "YOUR_ID",
        storageBucket: "YOUR_BUCKET",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let attempts = 0;
    let locked = false;

    function toggleView(toSignup) {
        document.getElementById('mainContainer').classList.toggle('show-signup', toSignup);
    }

    function handleLogin() {
        if(locked) return;
        const user = document.getElementById('lUser').value;
        const pass = document.getElementById('lPass').value;

        auth.signInWithEmailAndPassword(user, pass)
            .then(() => {
                showPopup("SUCCESS", "Access Granted.");
                // Add your redirection to the game here
            })
            .catch(() => {
                attempts++;
                showPopup("ERROR", "Wrong credentials entered.");
                if(attempts >= 3) triggerLockout();
            });
    }

    function handleSignup() {
        const user = document.getElementById('sUser').value;
        const pass = document.getElementById('sPass').value;
        const conf = document.getElementById('sConfirm').value;

        if(pass !== conf) {
            showPopup("ERROR", "Passcodes do not match.");
            return;
        }

        auth.createUserWithEmailAndPassword(user, pass)
            .then(res => {
                db.ref('users/' + res.user.uid).set({ username: user, joined: Date.now() });
                showPopup("SUCCESS", "Warrior Identity Created.");
                toggleView(false);
            })
            .catch(err => showPopup("ERROR", err.message));
    }

    function triggerLockout() {
        locked = true;
        let time = 30;
        const btn = document.getElementById('lBtn');
        const timerText = document.getElementById('timerText');
        btn.disabled = true;

        const interval = setInterval(() => {
            time--;
            timerText.innerText = `LOCKED: ${time}s`;
            if(time <= 0) {
                clearInterval(interval);
                locked = false;
                attempts = 0;
                btn.disabled = false;
                timerText.innerText = "";
            }
        }, 1000);
    }

    function showPopup(title, msg) {
        const p = document.createElement('div');
        p.className = 'popup';
        p.innerHTML = `<strong style="color:var(--orange)">${title}:</strong> ${msg}`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 3000);
    }
</script>
</body>
</html>
