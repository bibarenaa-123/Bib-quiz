<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BIB1 ARENA | Warrior Entry</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --orange: #FF7800;
            --glass-base: rgba(255, 255, 255, 0.02);
            --glass-typing: rgba(5, 5, 15, 0.9);
            --border-glow: rgba(255, 120, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000;
            height: 100vh; width: 100vw;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* ========== BACKGROUND LAYERS ========== */
        #particles-js {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
        }

        .page-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('image_0.png') no-repeat center center;
            background-size: cover;
            opacity: 0.25;
            z-index: 1;
        }

        /* ========== GLASSMORPHISM CONTAINER ========== */
        .main-container {
            position: relative;
            z-index: 10;
            width: 90%; max-width: 420px;
            background: var(--glass-base);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.5s ease;
            overflow: hidden; /* Critical for hiding the panel not in view */
        }

        /* Darken & Blur when typing */
        .main-container.is-typing {
            background: var(--glass-typing);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-color: var(--border-glow);
            box-shadow: 0 0 40px rgba(255, 120, 0, 0.15);
        }

        /* ========== STRICT HORIZONTAL SLIDER ========== */
        .form-stage {
            display: flex;
            width: 200%; /* 200% makes it exactly wide enough for two full-width panels */
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            align-items: stretch;
        }

        .panel { 
            flex: 0 0 50%; /* Force to exactly 50% of the stage (100% of container). No shrinking! */
            width: 50%; 
            padding: 50px 40px; /* Padding moved HERE to prevent breaking slider math */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* The Slide Action: Moves the stage left by 50% of its total width */
        .main-container.show-signup .form-stage { transform: translateX(-50%); }

        h2 { 
            font-family: 'Orbitron'; letter-spacing: 5px; 
            margin-bottom: 30px; color: #fff;
            text-shadow: 0 0 10px rgba(255, 120, 0, 0.3);
        }

        input {
            width: 100%; padding: 18px; margin: 10px 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; color: #fff; outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--orange); background: rgba(255,255,255,0.1); }

        .btn-glow {
            width: 100%; padding: 18px; margin-top: 25px;
            background: linear-gradient(135deg, var(--orange), #ff4d00);
            border: none; border-radius: 15px; color: white;
            font-family: 'Orbitron'; font-weight: 900;
            box-shadow: 0 10px 30px rgba(255, 120, 0, 0.3);
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-glow:active { transform: scale(0.96); }
        .btn-glow:disabled { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }

        .bottom-links { margin-top: 30px; font-size: 0.85rem; color: #bbb; width: 100%; }
        .bottom-links p { margin: 10px 0; }
        .bottom-links b { color: var(--orange); cursor: pointer; text-decoration: underline; }

        /* Notification Popup */
        .popup {
            position: fixed; top: 30px; left: 50%;
            transform: translateX(-50%);
            background: #000; border: 1px solid var(--orange);
            padding: 15px 35px; border-radius: 50px;
            color: #fff; z-index: 1000; font-family: 'Orbitron'; font-size: 0.9rem;
            box-shadow: 0 0 20px rgba(255,120,0,0.5);
            animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideDown { from { top: -100px; } to { top: 30px; } }
    </style>
</head>
<body>

    <div class="page-bg"></div>
    <div id="particles-js"></div>

    <div class="main-container" id="mainContainer">
        <div class="form-stage" id="formStage">
            
            <div class="panel" id="loginPanel">
                <h2>LOGIN</h2>
                <input type="text" class="auth-input" id="lUser" placeholder="WARRIOR ID">
                <input type="password" class="auth-input" id="lPass" placeholder="PASSCODE">
                <button class="btn-glow" id="lBtn" onclick="handleLogin()">AUTHENTICATE</button>
                
                <div id="lockTimer" style="color:var(--orange); font-weight:bold; margin-top:15px; font-family:'Orbitron'; font-size:0.8rem;"></div>
                
                <div class="bottom-links">
                    <p>Forgotten Credentials?</p>
                    <p>New BIB Warrior? <b onclick="toggleView(true)">Initialize Identity</b></p>
                </div>
            </div>

            <div class="panel" id="signupPanel">
                <h2>SIGN UP</h2>
                <input type="text" class="auth-input" id="sUser" placeholder="NEW WARRIOR ID">
                <input type="password" class="auth-input" id="sPass" placeholder="SET PASSCODE">
                <input type="password" class="auth-input" id="sConfirm" placeholder="CONFIRM PASSCODE">
                <button class="btn-glow" id="sBtn" onclick="handleSignup()">CREATE WARRIOR</button>
                
                <div class="bottom-links">
                    <p>Existing Identity? <b onclick="toggleView(false)">Return to Login</b></p>
                </div>
            </div>

        </div>
    </div>

<script>
    // --- FIREBASE INITIALIZATION ---
    const firebaseConfig = {
        apiKey: "YOUR_KEY",
        authDomain: "YOUR_DOMAIN",
        databaseURL: "YOUR_URL",
        projectId: "YOUR_ID",
        storageBucket: "YOUR_BUCKET",
        messagingSenderId: "YOUR_SENDER",
        appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // --- PARTICLES.JS ---
    particlesJS("particles-js", {
        "particles": {
            "number": { "value": 75 },
            "color": { "value": "#FF7800" },
            "shape": { "type": "circle" },
            "opacity": { "value": 0.4 },
            "size": { "value": 2 },
            "line_linked": { "enable": true, "distance": 140, "color": "#FF7800", "opacity": 0.3, "width": 1 },
            "move": { "enable": true, "speed": 1.5 }
        },
        "interactivity": {
            "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } }
        }
    });

    // --- AUDIO SYSTEM ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSFX(freq, dur) {
        try {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        } catch(e) {}
    }

    // --- INTERFACE LOGIC ---
    const inputs = document.querySelectorAll('.auth-input');

    // Handle typing transparency state
    inputs.forEach(input => {
        input.addEventListener('focus', () => {
            document.getElementById('mainContainer').classList.add('is-typing');
            playSFX(500, 0.1);
        });
        input.addEventListener('blur', () => {
            const hasData = Array.from(inputs).some(i => i.value.length > 0);
            if (!hasData) document.getElementById('mainContainer').classList.remove('is-typing');
        });
    });

    // --- HORIZONTAL SLIDER TRIGGER ---
    function toggleView(isSignup) {
        const container = document.getElementById('mainContainer');
        if(isSignup) {
            container.classList.add('show-signup'); // Slides left, bringing Signup (right panel) into view
        } else {
            container.classList.remove('show-signup'); // Slides back to Login
        }
        playSFX(300, 0.2); 
    }

    // --- AUTHENTICATION LOGIC ---
    let loginFailures = 0;
    let isLockedOut = false;

    function handleLogin() {
        if(isLockedOut) return;
        const u = document.getElementById('lUser').value.trim();
        const p = document.getElementById('lPass').value;

        if(!u || !p) return showPopup("ERROR", "Fill all fields.");

        auth.signInWithEmailAndPassword(u, p)
            .then(() => {
                playSFX(800, 0.4);
                showPopup("AUTHORIZED", "Welcome, Warrior.");
            })
            .catch(() => {
                loginFailures++;
                playSFX(150, 0.3);
                showPopup("ACCESS DENIED", "Wrong credentials entered.");
                if(loginFailures >= 3) applyLockout();
            });
    }

    function handleSignup() {
        const u = document.getElementById('sUser').value.trim();
        const p = document.getElementById('sPass').value;
        const c = document.getElementById('sConfirm').value;

        if(!u || !p || !c) return showPopup("ERROR", "Fill all fields.");
        if(p !== c) return showPopup("ERROR", "Passcodes mismatch.");

        auth.createUserWithEmailAndPassword(u, p)
            .then(res => {
                db.ref('users/' + res.user.uid).set({ username: u, rank: 'Novice' });
                showPopup("INITIALIZED", "Warrior Identity Created.");
                toggleView(false); // Slide back to login on success
            })
            .catch(err => showPopup("FAILURE", err.message));
    }

    function applyLockout() {
        isLockedOut = true;
        let countdown = 30;
        const btn = document.getElementById('lBtn');
        const timer = document.getElementById('lockTimer');
        btn.disabled = true;

        const clock = setInterval(() => {
            countdown--;
            timer.innerText = `SECURITY LOCK: ${countdown}s`;
            if(countdown <= 0) {
                clearInterval(clock);
                isLockedOut = false;
                loginFailures = 0;
                btn.disabled = false;
                timer.innerText = "";
            }
        }, 1000);
    }

    function showPopup(title, msg) {
        const p = document.createElement('div');
        p.className = 'popup';
        p.innerHTML = `<span style="color:var(--orange)">${title}:</span> ${msg}`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 3000);
    }
</script>
</body>
</html>
